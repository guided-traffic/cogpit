# Test and Release: the pipeline of every push to main and every pull request, and the workflow
# behind the README's build badge. Every check is a job of its own with its own make target, so it
# runs the same on a laptop, and no job needs more than ten minutes (owner, 2026-10-13): the UI's
# race tests run in shards. Semantic Release needs every job. What each job runs and how long it
# takes: docs/developer/releasing.md#ci.
#
# Every job's limit is 30 minutes: set so for the first runs after Go 1.27.3 (2026-10-21), whose
# build caches were made then, and kept since main's pushes alone save caches (D-112): a pull request
# that changes go.mod or go.sum compiles what changed in each of its runs, and a job without its
# cache took up to 16.5 minutes (macOS, 2026-10-21).
#
# Linux jobs run on the organisation's self-hosted runners (ephemeral pods, Ubuntu 24.04, 16 CPUs,
# Docker; no make or C compiler until .github/actions/go-setup installs them), as the team's other
# repositories do, unless the repository variable LINUX_RUNNER names other runners (ubuntu-latest:
# GitHub's hosted ones, which take the load off the shared self-hosted machine). The macOS job and
# the Windows compile run on GitHub's hosted runners, free for a public repository.
#
# Semantic Release creates the tag and the GitHub release with the organisation's GitHub App token,
# so the release's "published" event starts the release pipeline (build.yml).
name: Test and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a run, on main too: semantic-release releases every commit since the
  # last tag, so a cancelled run loses nothing.
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every test runs on every run: the restored build cache also holds Go's cached test results,
  # which would turn a gate into "nothing changed since a run that passed" and hide a flaky test.
  GOFLAGS: -count=1

jobs:
  # golangci-lint with the team's linters and depguard's layering (the import rules of
  # docs/developer/architecture.md §3), and the release build's variant.
  lint:
    name: Code Linting
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: lint

      - name: Lint
        run: make lint

      # The release build's variant (D-67), which no other job builds: make dist-app builds with the
      # tag nodemo, so internal/demo must be in neither binary with it, and the packages with nodemo
      # files lint and pass their TestNoDemo* tests with it.
      - name: The release build's variant (-tags nodemo)
        run: make check-nodemo

  # The parity checklists and the numbers the progress pages report (D-15).
  parity:
    name: Parity
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: parity
          fyne-deps: "false"

      - name: Parity checklists
        run: make parity

  # gosec through golangci-lint, the shipped code only; accepted findings are excluded in
  # .golangci.yml with their reason.
  gosec:
    name: GoSec Security Scan
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: lint

      - name: GoSec
        run: make gosec

  # govulncheck reports known vulnerabilities only where Cogpit's code reaches the affected
  # symbol. Loading the packages runs cgo, hence Fyne's build dependencies.
  govulncheck:
    name: Vulnerability Check
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: vuln

      - name: Vulnerability check
        run: make vuln

  cyclomatic-complexity:
    name: Cyclomatic Complexity
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: cyclo
          fyne-deps: "false"

      - name: Cyclomatic complexity
        run: make cyclo

      - name: Complexity report
        if: always()
        run: |
          {
            echo "## Cyclomatic complexity"
            echo
            echo "Threshold: $(sed -n -E 's/^CYCLO_THRESHOLD *\?= *([0-9]+).*/\1/p' Makefile) (no function above it). The 20 most complex functions:"
            echo
            echo '```'
            make -s cyclo-report
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # On Linux every test runs under the race detector (D-112), in the race jobs below, but what the
  # race detector keeps from running, which this job runs without it: internal/ui/logo (left out of
  # race-rest) and the tests that skip themselves, or part of their checks, under it (hack/shard
  # -norace over ./...: the UI's terminal tests, the cache's heap measurements). Until 2026-10-21 it
  # ran every package a second time, the UI's in four processes.
  unit-tests:
    name: Unit Tests (no race)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: unit

      - name: The tests the race detector keeps from running, with coverage
        run: make test-norace-coverage

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-unit
          path: .cache/coverage/unit*.out
          include-hidden-files: true
          retention-days: 7

  # The UI's tests under the race detector take 18 minutes on a Linux runner, so they run in
  # shards: hack/shard assigns each test to one by a hash of its name, so a new test lands in a
  # shard without a change here. The number of shards is the matrix's length (RACE_SHARDS).
  race-ui:
    name: Race Tests (UI ${{ matrix.shard }}/8)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: race-ui

      - name: Race tests of internal/ui/fyneui, shard ${{ matrix.shard }} of 8
        run: make test-race-ui RACE_SHARD=${{ matrix.shard }} RACE_SHARDS=8

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-race-ui-${{ matrix.shard }}
          path: .cache/coverage/race-ui-${{ matrix.shard }}.out
          include-hidden-files: true
          retention-days: 7

  # Every other package under the race detector, and the patched terminal widget's tests.
  race-rest:
    name: Race Tests (other packages)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: race-rest

      - name: Race tests
        run: make test-race-rest

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-race-rest
          path: .cache/coverage/race-rest.out
          include-hidden-files: true
          retention-days: 7

  # The cluster tests against a real API server and kubelet: views, logs, exec, kubectl in the
  # terminal, Helm, metrics. make kind-up writes the cluster's kubeconfig to .cache/kind/kubeconfig;
  # nothing in this job reads or writes ~/.kube. The cluster's name carries the run's id, so two
  # runs on one Docker host cannot meet.
  kind:
    name: Integration Tests (kind)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    env:
      KIND_CLUSTER: cogpit-${{ github.run_id }}
      KUBECONFIG: ${{ github.workspace }}/.cache/kind/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: kind

      # install_only: the cluster comes from make kind-up (hack/kind/cluster.yaml). kind v0.33.0
      # defaults to Kubernetes 1.37.0; kubectl matches client-go v0.37.1.
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          install_only: true
          ignore_failed_clean: true

      # The cluster starts (a minute or two, image pulls included) while the tests compile.
      - name: Create the kind cluster while the cluster tests compile
        run: |
          set -euo pipefail
          mkdir -p .cache
          ( make kind-up > .cache/kind-up.log 2>&1; echo $? > .cache/kind-up.status ) &
          make test-kind-compile
          wait
          cat .cache/kind-up.log
          test "$(cat .cache/kind-up.status)" = 0

      # kind-seed waits for web and api but does not fail on slow image pulls; the pod shell test
      # needs the toolbox pod running.
      - name: Wait for the seed
        run: |
          kubectl --context "kind-${KIND_CLUSTER}" -n cogpit-demo rollout status deployment/web --timeout=300s
          kubectl --context "kind-${KIND_CLUSTER}" -n cogpit-demo rollout status deployment/api --timeout=300s
          kubectl --context "kind-${KIND_CLUSTER}" -n cogpit-demo wait --for=condition=Ready pod/toolbox --timeout=300s

      - name: Cluster tests (race detector on)
        run: make test-kind

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-integration
          path: .cache/coverage/integration.out
          include-hidden-files: true
          retention-days: 7

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl --context "kind-${KIND_CLUSTER}" get nodes -o wide || true
          kubectl --context "kind-${KIND_CLUSTER}" get pods -A -o wide || true
          kubectl --context "kind-${KIND_CLUSTER}" -n cogpit-demo describe pods || true
          kubectl --context "kind-${KIND_CLUSTER}" -n cogpit-demo get events --sort-by=.lastTimestamp || true

      - name: Delete the kind cluster
        if: always()
        run: make kind-down || true

  # Cordon, uncordon and drain need a cluster with workers of their own (hack/kind/drain-cluster.yaml).
  kind-drain:
    name: Integration Tests (kind drain)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    env:
      KIND_DRAIN_CLUSTER: cogpit-drain-${{ github.run_id }}
      KUBECONFIG: ${{ github.workspace }}/.cache/kind-drain/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: kind

      - name: Install kind and kubectl
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          install_only: true
          ignore_failed_clean: true

      - name: Create the drain cluster while the drain tests compile
        run: |
          set -euo pipefail
          mkdir -p .cache
          ( make kind-drain-up > .cache/kind-drain-up.log 2>&1; echo $? > .cache/kind-drain-up.status ) &
          make test-kind-drain-compile
          wait
          cat .cache/kind-drain-up.log
          test "$(cat .cache/kind-drain-up.status)" = 0

      - name: Drain tests (race detector on)
        run: make test-kind-drain

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-integration-drain
          path: .cache/coverage/integration-drain.out
          include-hidden-files: true
          retention-days: 7

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl --context "kind-${KIND_DRAIN_CLUSTER}" get nodes -o wide || true
          kubectl --context "kind-${KIND_DRAIN_CLUSTER}" get pods -A -o wide || true

      - name: Delete the drain cluster
        if: always()
        run: make kind-drain-down || true

  # The tests tagged envtest against a real kube-apiserver and etcd (envtest, Kubernetes 1.37.0)
  # without Docker or a kubelet: D-58's standby case stops the API server's process (SIGSTOP), which
  # the shared kind cluster cannot do. The binaries come from envtest's release store, pinned by
  # version and SHA-512 (make envtest-bin, hack/envtest/fetch.sh), kept per pin in the cache.
  envtest:
    name: Integration Tests (envtest)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: envtest

      - name: The envtest binaries' cache key
        id: envtest
        run: echo "key=$(make -s envtest-key)" >> "${GITHUB_OUTPUT}"

      - name: Restore the envtest binaries
        uses: actions/cache@v6
        with:
          path: .cache/envtest
          key: ${{ steps.envtest.outputs.key }}

      # The binaries download (when the cache had none) while the tests compile.
      - name: Download the envtest binaries while the envtest tests compile
        run: |
          set -euo pipefail
          mkdir -p .cache
          ( make envtest-bin > .cache/envtest-bin.log 2>&1; echo $? > .cache/envtest-bin.status ) &
          make test-envtest-compile
          wait
          cat .cache/envtest-bin.log
          test "$(cat .cache/envtest-bin.status)" = 0

      - name: Envtest tests (race detector on)
        run: make test-envtest

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: profile-envtest
          path: .cache/coverage/envtest.out
          include-hidden-files: true
          retention-days: 7

  # What only macOS can test or build: the darwin-only tests (the title bar's AppKit harness, the
  # updater's Sparkle harness, the locale's CoreFoundation read), the lint of the packages with
  # darwin-only files, and the app bundle with Sparkle. A Fyne app with cgo and AppKit does not
  # cross-compile from Linux.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: macos

      - name: The macOS-only tests (race detector on)
        run: make test-darwin

      - name: Lint the packages with darwin-only files
        run: make lint LINT_PKGS="./internal/locale/... ./internal/ui/fyneui/... ./internal/ui/nativedialog/... ./internal/update/..."

      - name: Build and package Cogpit.app
        run: make app

  # The tests on Windows (D-111): every package's, in two jobs on GitHub's runner in MSYS2's MINGW64
  # shell (MinGW-w64 gcc for cgo and Fyne, make), without the race detector; the window's
  # (internal/ui/fyneui) in a job of their own, being most of a run. Until 2026-10-21 CI only
  # compiled and linked them there. (Linux needs no job of its own: the unit and race jobs run there.)
  windows-unit:
    name: Unit Tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Fail loudly when no C compiler is found instead of building without cgo.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: windows

      - name: Set up MSYS2 (MinGW-w64 gcc, make, unzip for make winsparkle)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: make unzip mingw-w64-x86_64-gcc

      - name: Toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version | head -n 1

      # Builds every package, the main ones linked (cmd/cogpit with Fyne's GL driver), vets them
      # and runs every package's tests but the window's, with the pinned WinSparkle fetched first so
      # that the updater's test loads the real DLL.
      - name: Vet and test every package but the window's
        run: make test-windows-unit

  windows-ui:
    name: UI Tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: windows-ui

      - name: Set up MSYS2 (MinGW-w64 gcc, make)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: make mingw-w64-x86_64-gcc

      - name: The window's tests
        run: make test-windows-ui

  # Cogpit for Linux (D-108) as the release pipeline builds it, for this commit: make dist-linux
  # (the release's build tags, the package with its launcher, icons, update helper and APT
  # repository) at version 0.0.1, below every release, then lintian on it and the APT repository's
  # scripts end to end with a throwaway key (make test-linux-package). A change that breaks the
  # release's Linux jobs fails here, before a release.
  linux-package:
    name: Linux Package
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The packaging tools install with Go's build dependencies, in the background.
      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: linux-package
          packages: dpkg-dev lintian apt-utils gnupg curl python3

      - name: Build the package
        run: make dist-linux VERSION=0.0.1

      - name: Check the package and the APT repository's scripts
        run: make test-linux-package

  # Cogpit for Windows (D-111) as the release pipeline builds it, for this commit: make dist-windows
  # at version 0.0.1, below every release, in MSYS2's MINGW64 shell (MinGW-w64 gcc, make and NSIS
  # from its signed packages), then make test-windows-package: the setup installs for the runner's
  # user, installs again over itself and uninstalls. A change that breaks the release's Windows job
  # fails here, before a release.
  windows-package:
    name: Windows Package
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: windows-package

      - name: Set up MSYS2 (MinGW-w64 gcc, make, NSIS)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: make unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-nsis

      - name: Build the setup
        run: make dist-windows VERSION=0.0.1

      - name: Install, update and uninstall it
        run: make test-windows-package

  # The unit, race and cluster profiles merged: the job summary, and the README's badge, which
  # Semantic Release commits with the release.
  coverage:
    name: Combined Coverage Report
    needs: [unit-tests, race-ui, race-rest, kind, kind-drain, envtest]
    if: always() && needs.unit-tests.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: coverage
          fyne-deps: "false"

      - name: Download the coverage profiles
        uses: actions/download-artifact@v8
        with:
          pattern: profile-*
          merge-multiple: true
          path: .cache/coverage

      - name: Merge the profiles
        run: |
          set -euo pipefail
          ls -l .cache/coverage
          make coverage-report
          cat .cache/coverage/combined/summary.md >> "${GITHUB_STEP_SUMMARY}"
          mkdir -p dist/coverage
          cp .github/badges/coverage.json .cache/coverage/combined/* dist/coverage/

      - name: Upload the combined report and badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: dist/coverage
          retention-days: 7

  # The version from the commits since the last tag, the release notes, the release commit with the
  # badge ([skip ci]), the tag and the GitHub release (.releaserc.json; docs/developer/releasing.md#release-flow).
  semantic-release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, parity, gosec, govulncheck, cyclomatic-complexity, unit-tests, race-ui, race-rest, kind, kind-drain, envtest, macos, windows-unit, windows-ui, linux-package, windows-package, coverage]
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      # The organisation's GitHub App, scoped to this repository; the token expires after an hour
      # and is revoked at the end of the job. Not GITHUB_TOKEN: a release created with it would not
      # start the release pipeline (build.yml).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write  # tag, release, @semantic-release/git commit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the combined coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-combined
          path: ${{ runner.temp }}/coverage

      - name: Put the badge in place
        run: |
          cp "${RUNNER_TEMP}/coverage/coverage.json" .github/badges/coverage.json
          cat .github/badges/coverage.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
