# Release Build: what a release holds. Semantic Release (release.yml) creates the tag and the GitHub
# release with the GitHub App's token once every gate on main is green; the release's "published"
# event starts this workflow on the tag (github.ref is refs/tags/v<version>), which builds the app,
# signs it, has Apple notarize it (two jobs, so that a re-run waits for the same submission) and
# attaches it to the release with SHA256SUMS; then the release's item joins Sparkle's appcast, signed
# in the environment sparkle and deployed to GitHub Pages. A release made with GITHUB_TOKEN would
# start no workflow, hence the App.
# A release holds the complete product only (owner, 2026-10-14, D-16): today the macOS app in its
# disk image, with cogpit-cli inside the app, and SHA256SUMS; no cogpit-cli archives for any
# platform. What vouches for it: docs/developer/releasing.md#the-release-pipeline,
# docs/security/updates.md.
name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The release builds start without a build cache: an artifact never comes from objects another run
# wrote, and saving the six platforms' cache took 5:18 minutes from the self-hosted runner (v0.1.0),
# longer than building them.

jobs:
  # The desktop app needs macOS: cgo with AppKit does not cross-compile from Linux (make dist-app),
  # and cogpit-cli goes into its bundle (Contents/MacOS). Signed ad-hoc here; the signing job signs
  # it with the Developer ID. This job sees no secret.
  macos-app:
    name: Cogpit.app (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none

      # The Kubernetes release table of the release's day (D-91): upstream's schedule.yaml and
      # eol.yaml from raw.githubusercontent.com, checked, into internal/model/k8seol/releases.json,
      # which both binaries embed. A failed download or check keeps the committed table (a warning
      # here, the build goes on); what changed against it is in this step's log (H-130).
      - name: Refresh the Kubernetes release table
        run: make k8s-eol K8SEOL_FLAGS=-fallback

      # Sparkle (D-4) goes into the bundle with the update key's public half, a repository variable
      # (not a secret: every installed copy shows it); unset, the app has no updater. Both binaries
      # are built with the Makefile's DIST_TAGS, which leave the demo cluster out (D-67), and
      # dist-app fails unless both recorded them. Fyne's thread check is off in a release (speed,
      # D-103); the repository variable FYNE_THREAD_CHECKS=on builds the next releases with it on
      # again (today's behaviour before D-103), without a code change; unset or off: off.
      - name: Build and zip Cogpit.app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          FYNE_THREAD_CHECKS: ${{ vars.FYNE_THREAD_CHECKS }}
        run: make dist-app VERSION="${GITHUB_REF_NAME#v}"

      - name: Check the bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plist=bin/Cogpit.app/Contents/Info.plist
          plutil -extract CFBundleShortVersionString raw "${plist}" | grep -qx "${version}"
          plutil -extract CFBundleVersion raw "${plist}" | grep -qx "${version}"
          test -f bin/Cogpit.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle
          key="$(plutil -extract SUPublicEDKey raw "${plist}" 2>/dev/null || true)"
          test "${key}" = "${SPARKLE_PUBLIC_ED_KEY}"
          echo "update key: ${key:-none (this release does not update itself)}"
          codesign --verify --strict --deep bin/Cogpit.app
          lipo -archs bin/Cogpit.app/Contents/MacOS/cogpit
          # cogpit-cli in the bundle (D-16): the app's architecture, its identifier, and it says
          # the release's version. It runs here, never in the signing job.
          cli=bin/Cogpit.app/Contents/MacOS/cogpit-cli
          test "$(lipo -archs "${cli}")" = "$(lipo -archs bin/Cogpit.app/Contents/MacOS/cogpit)"
          codesign --display --verbose=2 "${cli}" 2>&1 | grep -x 'Identifier=io.guided-traffic.cogpit.cli'
          out="$("${cli}" version)"
          echo "${out}"
          case "${out}" in "cogpit-cli ${version} "*) ;; *) echo "::error::${cli} version: ${out}"; exit 1 ;; esac
          unzip -l "dist/Cogpit_${version}_darwin_arm64.zip" Cogpit.app/Contents/MacOS/cogpit-cli
          unzip -l "dist/Cogpit_${version}_darwin_arm64.zip" | tail -n 1

      # The disk image's window as a template without the app (D-70): dmgbuild, pinned with its
      # hashes, is code from PyPI, so it runs here, never in the job with the signing identity,
      # which checks the template's contents and fills it in with Apple's tools only.
      - name: Set up Python for dmgbuild
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the disk image's template
        run: make dist-dmg-template VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            dist/Cogpit_*_darwin_*.zip
            dist/Cogpit-*-template.dmg
          if-no-files-found: error
          retention-days: 7

  # The app, with Sparkle and cogpit-cli signed inside-out before it, in the disk image
  # Cogpit-<version>-macos-<arch>.dmg, signed with the Developer ID (hardened runtime, Apple's
  # timestamp), checked, and submitted to Apple's notary service without waiting
  # (make dist-macos-sign: hack/macos/release.sh sign). The signed disk image and the record of its
  # submission (notary-submission.json: the id and the disk image's SHA-256) go on as the artifact
  # macos-signed to the next job, which waits for Apple.
  #
  # One of the two jobs in the environment `release`, whose secrets only a tag v* may use, and the
  # only one with the certificate. It builds nothing and runs no Go, not even the bundled cogpit-cli,
  # so no code of Cogpit's or its dependencies' shares a job with the signing identity. Without the
  # secrets (a fork) the app zip passes through unsigned. With some of them, or when a signature or a
  # check fails, the job fails and the release gets no files until the failed jobs are re-run, never
  # unsigned files under a signed note (docs/developer/releasing.md#when-signing-or-notarization-fails).
  macos-sign:
    name: Sign and submit (macOS)
    needs: [macos-app]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 30
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Download the app
        uses: actions/download-artifact@v8
        with:
          name: macos-app
          path: dist

      - name: Sign and submit to Apple's notary service
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Apple's intermediate for Developer ID certificates (G2, valid to 2031-09-17), pinned by
          # its SHA-256: the runner's keychain needs it beside the .p12, or the identity is not valid.
          MACOS_SIGN_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          MACOS_SIGN_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: make dist-macos-sign VERSION="${GITHUB_REF_NAME#v}"

      # The script deletes them itself; this covers a cancelled run.
      - name: Delete the signing keychain and the key files
        if: always()
        run: hack/macos/release.sh cleanup

      - name: Upload the signed disk image and its submission
        uses: actions/upload-artifact@v7
        with:
          name: macos-signed
          path: dist/macos/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Apple's verdict on that very submission, the disk image's ticket stapled, and the disk image and
  # the app in it checked as Gatekeeper checks them (make dist-macos-notarize: hack/macos/release.sh
  # notarize). A job of its own so that its re-run waits for the same submission: when the signing
  # and the waiting were one job, every re-run signed a new disk image and submitted it again, which
  # started Apple's queue over, and v0.9.0 to v0.12.0 (2026-10-15) got no download after five
  # attempts of 45 minutes each. It waits up to 330 minutes (a GitHub-hosted job ends at 360); if
  # Apple takes longer, re-running this failed job waits on. macOS minutes cost nothing here (the
  # repository is public). In the environment `release` for the team API key only: no certificate,
  # and it runs nothing of Cogpit's either. Without a submission (no secrets) the unsigned zip passes.
  macos-notarize:
    name: Notarize and staple (macOS)
    needs: [macos-sign]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 345
    outputs:
      signed: ${{ steps.notarize.outputs.signed }}
      identity: ${{ steps.notarize.outputs.identity }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Download the signed disk image and its submission
        uses: actions/download-artifact@v8
        with:
          name: macos-signed
          path: dist/macos

      - name: Wait for Apple's notarization, staple and check
        id: notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_TIMEOUT_MINUTES: 330
        run: make dist-macos-notarize VERSION="${GITHUB_REF_NAME#v}"

      - name: Delete the key file
        if: always()
        run: hack/macos/release.sh cleanup

      - name: Upload the macOS download
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/macos/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Attach to the release
    needs: [macos-notarize]
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    permissions:
      contents: write  # upload the assets, append the note to the release's text
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Install make
        run: command -v make >/dev/null || hack/ci/apt-install.sh make

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: make dist-checksums

      # Exactly the files the notarization job's verdict promises, and nothing else (D-16: the complete
      # product only): with the signature the disk image, without it the app zip; and SHA256SUMS.
      - name: Check the files and write the note
        id: files
        env:
          SIGNED: ${{ needs.macos-notarize.outputs.signed }}
          IDENTITY: ${{ needs.macos-notarize.outputs.identity }}
        run: |
          set -euo pipefail
          cd dist
          expect() {
            n="$(find . -maxdepth 1 -name "$1" | wc -l | tr -d ' ')"
            [ "${n}" = "$2" ] || { echo "::error::dist/$1: ${n} files, expected $2"; exit 1; }
          }
          if [ "${SIGNED}" = true ]; then
            expect 'Cogpit-*-macos-*.dmg' 1
            expect 'Cogpit_*_darwin_*.zip' 0
          else
            expect 'Cogpit-*.dmg' 0
            expect 'Cogpit_*_darwin_*.zip' 1
          fi
          expect SHA256SUMS 1
          n="$(find . -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          [ "${n}" = 2 ] || { echo "::error::dist holds $(find . -mindepth 1 -maxdepth 1 | tr '\n' ' '), expected the download and SHA256SUMS only"; exit 1; }
          {
            echo 'list<<EOF'
            find . -maxdepth 1 \( -name '*.zip' -o -name '*.dmg' -o -name SHA256SUMS \) | sed 's|^\./|dist/|' | sort
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

          note="${RUNNER_TEMP}/note.md"
          if [ "${SIGNED}" = true ]; then
            dmg="$(find . -maxdepth 1 -name 'Cogpit-*-macos-*.dmg' | sed 's|^\./||')"
            cat > "${note}" <<EOF

          ---

          **Download.** \`${dmg}\` is Cogpit for macOS on Apple silicon: open it and drag Cogpit into Applications. The command-line tool \`cogpit-cli\` comes inside the app, at \`/Applications/Cogpit.app/Contents/MacOS/cogpit-cli\`. Check the disk image against \`SHA256SUMS\` (\`shasum -a 256 -c SHA256SUMS\`).

          **Signed and notarized.** The app, its \`cogpit-cli\` and the disk image are signed with the Developer ID "${IDENTITY}" and notarized by Apple; the disk image carries its ticket, so macOS opens it without a warning, offline too. \`SHA256SUMS\` is not signed ([docs/security/updates.md](https://github.com/guided-traffic/cogpit/blob/main/docs/security/updates.md)). Cogpit for Linux and Windows comes with milestone M11.
          EOF
          else
            cat > "${note}" <<'EOF'

          ---

          **Download.** `Cogpit.app` for macOS on Apple silicon, zipped, with the command-line tool `cogpit-cli` inside it (`Cogpit.app/Contents/MacOS/cogpit-cli`); check it against `SHA256SUMS` (`shasum -a 256 -c SHA256SUMS`).

          **Unsigned.** This build ran without the project's Apple signing material: neither the app nor its `cogpit-cli` is signed with a Developer ID or notarized. macOS blocks the first start of a downloaded copy: allow it once in System Settings → Privacy & Security → Open Anyway ([docs/security/updates.md](https://github.com/guided-traffic/cogpit/blob/main/docs/security/updates.md)). Cogpit for Linux and Windows comes with milestone M11.
          EOF
          fi
          cat "${note}"

      - name: Attach the artifacts and the note
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: true
          append_body: true
          body_path: ${{ runner.temp }}/note.md

  # Sparkle's appcast (D-4; docs/developer/releasing.md#the-appcast): the update feed at
  # https://guided-traffic.github.io/cogpit/appcast.xml, one feed with the releases' history, signed
  # with the update key. Three jobs, so that the key shares a job with nothing but Sparkle's own
  # sign_update: the draft (Go, no secret), the signature (the environment sparkle, no Go), and the
  # check and deploy (the public key, the environment github-pages). They run once the release's
  # files are attached, so the item never points at a missing download, and they cannot take the
  # files back: whatever happens here, the release keeps them.
  appcast-draft:
    name: Appcast (draft)
    needs: [macos-notarize, publish]
    if: needs.macos-notarize.outputs.signed == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      drafted: ${{ steps.draft.outputs.drafted }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none
          fyne-deps: "false"

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      # An app built without the update key (the variable unset) gets no item: drafted=false.
      - name: Draft the appcast
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make appcast-draft VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the draft
        if: steps.draft.outputs.drafted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appcast-draft
          path: dist/appcast/
          if-no-files-found: error
          retention-days: 7

  # The only job in the environment `sparkle` (the owner its required reviewer, tags v* only), the
  # only one that sees SPARKLE_ED_PRIVATE_KEY. Without the key it signs nothing and nothing is
  # deployed, never a failure; with it, it refuses unless the environment has its reviewer and its
  # tag rule (GitHub creates a named environment without any), then signs the disk image and the
  # feed with sign_update from the pinned Sparkle archive. The key reaches sign_update on its
  # standard input only (hack/macos/appcast.sh).
  appcast-sign:
    name: Appcast (sign)
    needs: [appcast-draft]
    if: needs.appcast-draft.outputs.drafted == 'true'
    runs-on: macos-latest
    environment: sparkle
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # the environment's protection rules
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      - name: Download the draft
        uses: actions/download-artifact@v8
        with:
          name: appcast-draft
          path: dist/appcast

      - name: Sign the disk image and the appcast
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: make appcast-sign VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the signed appcast
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appcast-signed
          path: dist/site/
          if-no-files-found: error
          retention-days: 7

      # The key was never written to a file; this removes the job's work files on any outcome.
      - name: Remove the work files
        if: always()
        run: rm -rf dist .cache/sparkle

  # Checked with the public key before Pages gets it: the feed's signature, every item, and that
  # the release's item names this disk image with a signature over its bytes. Then deployed: Pages
  # serves exactly this feed (source "GitHub Actions"). The environment github-pages needs a
  # deployment rule for tags v* (docs/developer/releasing.md#setting-up-sparkle).
  appcast-deploy:
    name: Appcast (deploy to Pages)
    needs: [appcast-sign]
    if: needs.appcast-sign.outputs.signed == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}appcast.xml
    permissions:
      contents: read
      pages: write     # deploy to Pages
      id-token: write  # the deployment's OIDC token
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none
          fyne-deps: "false"

      - name: Install make
        run: command -v make >/dev/null || hack/ci/apt-install.sh make

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      - name: Download the draft
        uses: actions/download-artifact@v8
        with:
          name: appcast-draft
          path: dist/appcast

      - name: Download the signed appcast
        uses: actions/download-artifact@v8
        with:
          name: appcast-signed
          path: dist/site

      - name: Verify the signed appcast
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make appcast-verify VERSION="${GITHUB_REF_NAME#v}"

      # The site's artifact is named per run attempt: deploy-pages refuses a run that holds two
      # artifacts of one name, and a re-run of this job (or of the whole run) uploads its site
      # beside the earlier attempt's (v0.16.0's run, 2026-10-16).
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site/
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
