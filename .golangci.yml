version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - goconst
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: receiver-naming
        - name: increment-decrement
        - name: unexported-return
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: range
        - name: time-naming
        - name: var-declaration
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    # errcheck reports a bare receive from a chan error since golangci-lint v2.15.0 (errcheck
    # v1.30.0), and the blank assignment that marks an error left unread on purpose, `_ = <-errc`,
    # is what staticcheck's S1005 calls unnecessary: the two contradict each other. Options: a
    # //nolint:errcheck with its reason at every such receive, or S1005 off and `_ = <-errc`, the
    # repository's `_ = conn.Close()` for a receive. Chosen (the lead's decision, 2026-10-22): S1005
    # off. One idiom for every error left unread; errcheck's receive check stays on, which found two
    # tests that now check the error; S1005's other forms (`x, _ = m[k]`, `for x, _ = range`) had
    # no finding in the tree. The other checks are golangci-lint's default set.
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-S1005"]
    # Layering (docs/developer/architecture.md §3). A package imports only lower layers; only
    # internal/ui/... imports Fyne; model and kubeconfig do no I/O; only cluster, cache, terminal,
    # helm, metrics and alerting talk to the API server (kubectl talks to the release host and sigstore's log only).
    #   L5 cmd/*  ·  L4 ui/fyneui, mcp, agent, update, app  ·  L3 engine  ·  L2 helm, metrics, alerting, demo
    #   L1 cluster, cache, terminal, kubectl, locale  ·  L0 model, kubeconfig, buildinfo
    depguard:
      rules:
        fyne-only-in-ui:
          files:
            - "**/internal/**/*.go"
            - "!**/internal/ui/**"
          deny:
            - pkg: "fyne.io/fyne"
              desc: "only internal/ui/... imports Fyne"
            - pkg: "github.com/fyne-io"
              desc: "only internal/ui/... imports Fyne"
        l0-model-kubeconfig:
          files:
            - "**/internal/model/**"
            - "**/internal/kubeconfig/**"
            - "**/internal/buildinfo/**"
            - "!$test"
          deny:
            - pkg: "github.com/guided-traffic/cogpit/internal/locale"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/cluster"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/cache"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/terminal"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/kubectl"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/demo"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/helm"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/metrics"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/engine"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/mcp"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/agent"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/update"
              desc: "L0 imports nothing above L0"
            - pkg: "github.com/guided-traffic/cogpit/internal/ui"
              desc: "L0 imports nothing above L0"
            - pkg: "k8s.io/client-go/kubernetes"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/rest"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/dynamic"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/discovery"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/transport"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/informers"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/metadata"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/tools/cache"
              desc: "model and kubeconfig do no I/O"
            - pkg: "k8s.io/client-go/tools/remotecommand"
